<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dizzaroo is a light-themed app. `only light` opts out of OS dark mode AND
         the browser's forced auto-darkening (Chrome/Edge "auto dark mode"), which
         previously re-darkened the UI even with no dark CSS present. -->
    <meta name="color-scheme" content="only light" />
    <!-- Urbanist Font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Dizzaroo CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
